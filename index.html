<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8590c">
<title>Zeitreise-Quiz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 20px/1.4 system-ui, sans-serif; color: #2b2118; overflow-wrap: anywhere; min-height: 100vh;
    background: #fff3bf linear-gradient(160deg, #fff3bf, #ffdeeb 55%, #d0ebff);
  }
  main { max-width: 600px; margin: 0 auto; padding: 16px; }
  h1, h2 { margin: 8px 0 16px; }
  .kopf { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
  button {
    display: block; width: 100%; min-height: 56px; margin: 10px 0; padding: 12px 16px;
    font: inherit; font-weight: 600; border: 0; border-radius: 14px; cursor: pointer;
    background: #e8590c; color: #fff; box-shadow: 0 4px 0 #a63e06;
  }
  button:disabled { cursor: default; opacity: 1; }
  .home { width: auto; min-height: 48px; margin: 0; background: #fff; color: inherit; box-shadow: 0 3px 0 #ddd; }
  .serie { font-size: 24px; font-weight: 700; }
  .kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kachel { margin: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
  .kachel .emoji { display: block; font-size: 40px; }
  .kachel small { display: block; font-weight: 400; }
  .antwort { background: #7048e8; box-shadow: 0 4px 0 #4c2fb0; text-align: left; }
  .ok { background: #2f9e44; box-shadow: 0 4px 0 #1f6e2f; }
  .no { background: #e03131; box-shadow: 0 4px 0 #a51d1d; }
  .info { background: #fff; padding: 12px 16px; border-radius: 14px; }
  .gross { font-size: 48px; text-align: center; margin: 8px 0; }
  details { background: #fff; border-radius: 14px; padding: 12px 16px; margin: 10px 0; }
  summary { font-weight: 600; cursor: pointer; }
  .leiste { height: 16px; background: #eee; border-radius: 8px; overflow: hidden; margin-top: 6px; }
  .leiste i { display: block; height: 100%; background: linear-gradient(90deg, #f59f00, #2f9e44); }
  .karten { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .karten .info { margin: 0; }
  .balken { display: flex; gap: 6px; align-items: flex-end; height: 170px; }
  .balken div { flex: 1; text-align: center; font-size: 14px; }
  .balken b { display: block; background: linear-gradient(#7048e8, #1c7ed6); border-radius: 6px 6px 0 0; }
  .huepf { animation: huepf .6s ease-in-out infinite alternate; }
  @keyframes huepf { to { transform: translateY(-12px) scale(1.15); } }
</style>
</head>
<body>
<main id="app"></main>
<script src="fragen.js"></script>
<script>
const state = window.state = {
  screen: 'start', kapitel: null, selbst: null, einstufung: null, level: 1,
  benutzt: [], verlauf: [], punkte: 0, serie: 0, falsch: [], gesperrt: [], // gesperrt: letzte 32 bei Rundenstart
  frage: null // aktuelle Frage: {index, ziel, antworten (gemischt), gewaehlt}
};
const KEY = 'zeitreise';

// Alleswisser: Mix aus allen Kapiteln, berechnet aus fragen.js. Jede Frage merkt sich das Emoji ihrer Epoche.
const ALLE = [...KAPITEL, { id: 'alles', titel: 'Alleswisser', emoji: '🧠',
  fragen: KAPITEL.flatMap(k => k.fragen.map(f => ({ ...f, emoji: k.emoji }))) }];
const kap = () => ALLE.find(k => k.id === state.kapitel);
const RUNDE = 12; // Quizfragen pro Runde
const sterne = p => p >= 10 ? 3 : p >= 7 ? 2 : p >= 4 ? 1 : 0;
const sternText = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
function mische(a) { // Fisher-Yates: jede Reihenfolge gleich wahrscheinlich
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function laden() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}

function speichern(id, punkte) {
  try {
    const daten = laden(), alt = daten[id] || { best: 0, sterne: 0 };
    daten[id] = { best: Math.max(alt.best, punkte), sterne: Math.max(alt.sterne, sterne(punkte)) };
    localStorage.setItem(KEY, JSON.stringify(daten));
  } catch (e) { /* Speichern nicht möglich, App läuft trotzdem */ }
}

// Die letzten 32 gestellten Fragen pro Kapitel (älteste zuerst), dauerhaft gespeichert
function zuletzt() {
  try {
    return (JSON.parse(localStorage.getItem(KEY + '-zuletzt')) || {})[state.kapitel] || [];
  } catch (e) { return []; }
}

function merke(index) {
  try {
    const daten = JSON.parse(localStorage.getItem(KEY + '-zuletzt')) || {};
    daten[state.kapitel] = [...zuletzt().filter(i => i !== index), index].slice(-32);
    localStorage.setItem(KEY + '-zuletzt', JSON.stringify(daten));
  } catch (e) { /* ohne Speicher gilt nur die Regel „keine Wiederholung in dieser Runde“ */ }
}

// Fortschritt: jede beendete Quizrunde {t: Zeitpunkt, k: Kapitel, p: Punkte, n: Fragen}, höchstens 1000
const FARBEN = ['#e8590c', '#2f9e44', '#f08c00', '#1c7ed6', '#ae3ec9', '#e64980'];
const ZIEL = 5; // Wochenziel in Runden
function runden() {
  try { return JSON.parse(localStorage.getItem(KEY + '-runden')) || []; } catch (e) { return []; }
}
function protokolliere(p) {
  const neu = [...runden(), { t: Date.now(), k: state.kapitel, p, n: RUNDE }].slice(-1000);
  try { localStorage.setItem(KEY + '-runden', JSON.stringify(neu)); } catch (e) { /* ohne Speicher kein Verlauf */ }
}
const montag = (d = new Date()) => // Montag 0 Uhr der Woche von d
  new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7).getTime();
const monat = n => new Date(new Date().getFullYear(), new Date().getMonth() + n, 1).getTime();
function bilanz(von, bis) {
  const r = runden().filter(e => e.t >= von && e.t < bis), summe = key => r.reduce((s, e) => s + e[key], 0);
  return { runden: r.length, richtig: summe('p'), quote: r.length ? Math.round(100 * summe('p') / summe('n')) : 0 };
}
function tageSerie() { // Tage in Folge mit mindestens einer Runde, bis heute oder gestern
  const tage = new Set(runden().map(e => new Date(e.t).toDateString())), d = new Date();
  if (!tage.has(d.toDateString())) d.setDate(d.getDate() - 1);
  let n = 0;
  while (tage.has(d.toDateString())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function trend(a, b) {
  if (!a.runden) return "Diese Woche hast du noch keine Runde gespielt. Los geht's! 🚀";
  if (!b.runden) return 'Toller Start! Letzte Woche hast du noch nicht gespielt. 🌟';
  if (a.quote >= b.quote + 5) return 'Du bist besser als letzte Woche! 📈';
  if (a.quote <= b.quote - 5) return 'Letzte Woche lief es etwas besser. Du schaffst das! 💪';
  return 'So stark wie letzte Woche! 👍';
}
function fortschrittHtml() {
  const w0 = montag(), w1 = montag(new Date(w0 - 1));
  const karten = [['Diese Woche', w0, Infinity], ['Letzte Woche', w1, w0], ['Dieser Monat', monat(0), Infinity],
    ['Letzter Monat', monat(-1), monat(0)]].map(([name, von, bis]) => {
    const b = bilanz(von, bis);
    return `<div class="info"><b>${name}</b><br>🎮 ${b.runden} Runden<br>✅ ${b.richtig} richtig
      <br>🎯 ${b.quote} %</div>`;
  }).join('');
  let balken = '', von = w0, bis = Infinity;
  for (let i = 0; i < 8; i++, bis = von, von = montag(new Date(von - 1))) {
    balken = `<div><b style="height:${bilanz(von, bis).quote * 1.4}px"></b>${i ? 'vor ' + i : 'jetzt'}</div>` + balken;
  }
  return `<h2>📈 Mein Fortschritt</h2><div class="karten">${karten}</div>
    <p class="info">${trend(bilanz(w0, Infinity), bilanz(w1, w0))}</p>
    <h2>Trefferquote pro Woche</h2><div class="balken">${balken}</div>`;
}

// Stufen: Ziel-Level, dann Abstand 1 (erst niedriger), dann Abstand 2. Zuerst eine frische Frage
// (nicht in dieser Runde, nicht gesperrt) aus der nächsten Stufe, die eine hat;
// sonst die am längsten nicht gestellte.
function zieh() {
  const F = kap().fragen, z = state.level, G = state.gesperrt, frei = j => !state.benutzt.includes(j);
  const stufen = [z, z - 1, z + 1, z - 2, z + 2];
  const passend = ok => {
    const L = stufen.find(l => F.some((f, j) => f.level === l && ok(j)));
    return F.map((f, j) => j).filter(j => F[j].level === L && ok(j));
  };
  const frisch = passend(j => frei(j) && !G.includes(j));
  const index = frisch.length ? frisch[Math.floor(Math.random() * frisch.length)]
    : passend(frei).sort((a, b) => G.indexOf(a) - G.indexOf(b))[0];
  state.benutzt.push(index);
  merke(index);
  state.frage = { index, ziel: z, antworten: mische(F[index].antworten), gewaehlt: null };
}

function neuerDurchlauf() {
  Object.assign(state, { benutzt: [], verlauf: [], punkte: 0, serie: 0, falsch: [], gesperrt: zuletzt() });
}

function zeige(screen) {
  state.screen = screen;
  render();
  window.scrollTo(0, 0);
}

function oeffne(id) { state.kapitel = id; zeige('menu'); }
function selbst(n) {
  neuerDurchlauf();
  Object.assign(state, { selbst: n, level: n, einstufung: null });
  zieh();
  zeige('einstufung');
}

function losGehts() { zieh(); zeige('quiz'); }
function nochmal() { neuerDurchlauf(); zieh(); zeige('quiz'); }

function antwort(k) {
  const q = state.frage, f = kap().fragen[q.index];
  if (q.gewaehlt !== null) return;
  const richtig = q.antworten[k] === f.antworten[f.richtig];
  q.gewaehlt = k;
  state.verlauf.push({ index: q.index, ziel: q.ziel, richtig });
  state.serie = richtig ? state.serie + 1 : 0;
  state.level = Math.min(3, Math.max(1, state.level + (richtig ? 1 : -1)));
  if (state.screen === 'quiz') richtig ? state.punkte++ : state.falsch.push(q.index);
  render();
}

function weiter() {
  if (state.screen === 'einstufung' && state.verlauf.length === 3) {
    state.einstufung = state.level;
    return zeige('vergleich');
  }
  if (state.screen === 'quiz' && state.punkte + state.falsch.length === RUNDE) {
    speichern(state.kapitel, state.punkte);
    protokolliere(state.punkte);
    return zeige('ergebnis');
  }
  zieh();
  render();
}

function frageHtml() {
  const q = state.frage, f = kap().fragen[q.index], beantwortet = q.gewaehlt !== null;
  const richtig = f.antworten[f.richtig];
  const nr = state.screen === 'quiz'
    ? `Frage ${state.punkte + state.falsch.length + (beantwortet ? 0 : 1)}/${RUNDE}`
    : `Einstufung ${state.verlauf.length + (beantwortet ? 0 : 1)}/3`;
  const epoche = f.emoji ? ` · ${f.emoji}` : '';
  const knoepfe = q.antworten.map((a, k) => {
    let klasse = '', zeichen = '';
    if (beantwortet && a === richtig) [klasse, zeichen] = ['ok', '✅ '];
    else if (beantwortet && k === q.gewaehlt) [klasse, zeichen] = ['no', '❌ '];
    const gesperrt = beantwortet ? ' disabled' : '';
    return `<button class="antwort ${klasse}"${gesperrt} onclick="antwort(${k})">${zeichen}${a}</button>`;
  }).join('');
  const nachher = beantwortet ? `<p class="info">💡 ${f.info}</p><button onclick="weiter()">Weiter ➜</button>` : '';
  return `<p>${nr}${epoche}</p><h2>${f.text}</h2>${knoepfe}${nachher}`;
}

function vergleichText() {
  if (state.einstufung > state.selbst) return 'Du weißt mehr als du denkst! 💪';
  if (state.einstufung === state.selbst) return 'Deine Einschätzung passt! 👍';
  return 'Da üben wir noch ein bisschen! 🙂';
}

function ergebnisHtml() {
  const p = state.punkte, F = kap().fragen;
  const zeile = f => `<li>${f.text}<br>✅ <b>${f.antworten[f.richtig]}</b></li>`;
  const fehler = state.falsch.length
    ? '<ul>' + state.falsch.map(i => zeile(F[i])).join('') + '</ul>'
    : '<p>Alles richtig! 🎉</p>';
  return `<p class="gross huepf">${p >= 10 ? '🏆' : p >= 7 ? '🎉' : '💪'}</p><p class="gross">${p}/${RUNDE}</p>
    <p class="gross">${sternText(sterne(p))}</p>
    <p>Einstufung: Level ${state.einstufung} · Ende: Level ${state.level}</p>
    <h2>Das übst du noch:</h2>${fehler}
    <button onclick="nochmal()">Nochmal</button><button onclick="zeige('start')">Anderes Kapitel</button>`;
}

function startHtml() {
  const daten = laden();
  const kacheln = ALLE.map((k, i) => {
    const d = daten[k.id];
    return `<button class="kachel" style="background:${FARBEN[i]}" data-kapitel="${k.id}" onclick="oeffne('${k.id}')">
      <span class="emoji">${k.emoji}</span>${k.titel}
      <small>${sternText(d ? d.sterne : 0)}</small><small>Best: ${d ? d.best + '/' + RUNDE : '–'}</small></button>`;
  }).join('');
  const tage = tageSerie(), woche = bilanz(montag(), Infinity).runden;
  const status = `<div class="info">${tage ? `📅 ${tage} ${tage === 1 ? 'Tag' : 'Tage'} in Folge gespielt!`
    : '📅 Spiel heute und starte eine Serie!'}<br>🎯 Wochenziel: ${Math.min(woche, ZIEL)}/${ZIEL} Runden
    ${woche >= ZIEL ? '– geschafft! 🏆' : ''}
    <div class="leiste"><i style="width:${Math.min(100, 100 * woche / ZIEL)}%"></i></div></div>
    <button onclick="zeige('fortschritt')">📈 Mein Fortschritt</button>`;
  return `<h1>⏳ Zeitreise-Quiz</h1>${status}<p>Wähle ein Kapitel:</p><div class="kacheln">${kacheln}</div>`;
}

function render() {
  const s = state.screen, k = state.kapitel && kap();
  const kopf = s === 'start' ? '' : `<div class="kopf"><button class="home" onclick="zeige('start')">🏠</button>
    ${s === 'einstufung' || s === 'quiz' ? `<span class="serie">🔥 ${state.serie}</span>` : ''}</div>`;
  const inhalt = {
    start: startHtml,
    menu: () => `<h2>${k.emoji} ${k.titel}</h2>
      <button onclick="zeige('lernen')">Lernen</button><button onclick="zeige('selbst')">Quiz</button>`,
    lernen: () => `<h2>📖 ${k.titel}</h2><p>Tippe auf eine Frage, um die Antwort zu sehen.</p>` +
      [...k.fragen].sort((a, b) => a.level - b.level).map(f =>
        `<details><summary>${f.text}</summary><p>✅ <b>${f.antworten[f.richtig]}</b></p><p>${f.info}</p></details>`
      ).join(''),
    selbst: () => `<h2>Wie gut kennst du dich bei „${k.titel}“ aus?</h2>
      <button onclick="selbst(1)">Kenne ich kaum 😕</button><button onclick="selbst(2)">etwas 🙂</button>
      <button onclick="selbst(3)">gut 😎</button>`,
    einstufung: frageHtml,
    vergleich: () => `<p class="gross">🔎</p><h2>${vergleichText()}</h2>
      <p>Du startest jetzt mit Level ${state.level}.</p><button onclick="losGehts()">Los geht's</button>`,
    quiz: frageHtml,
    ergebnis: ergebnisHtml,
    fortschritt: fortschrittHtml
  }[s]();
  document.getElementById('app').innerHTML = kopf + inhalt;
}

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
